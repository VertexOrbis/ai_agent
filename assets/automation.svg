<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="auto-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />

  <!-- Pipeline Flow Nodes & Arrows -->
  <!-- Top Node -->
  <rect x="22" y="24" width="14" height="14" rx="3" stroke="#14B8A6" stroke-width="1.8" fill="#0B1528" />
  <circle cx="29" cy="31" r="2.5" fill="#14B8A6" />

  <!-- Top Arrow -->
  <path d="M37 31 L47 31" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
  <path d="M44 28 L47 31 L44 34" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Node -->
  <rect x="48" y="24" width="14" height="14" rx="3" stroke="#22D3EE" stroke-width="1.8" fill="#0B1528" />
  <path d="M52 31 L58 31 M55 28 L55 34" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />

  <!-- Down Curve Arrow -->
  <path d="M55 39 L55 45 C55 48 53 50 50 50 L46 50" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <path d="M49 47 L46 50 L49 53" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Node (Output/Sync) -->
  <rect x="22" y="44" width="22" height="13" rx="3" stroke="url(#auto-grad)" stroke-width="1.8" fill="#0B1528" />
  <!-- Checkmark or gear in bottom node -->
  <path d="M28 50 L31 53 L38 47" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
