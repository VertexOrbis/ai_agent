<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hero-grad-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="hero-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="300" cy="250" r="180" fill="url(#hero-core-glow)" />

  <!-- Outer Coordinate Rings -->
  <circle cx="300" cy="250" r="190" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="300" cy="250" r="140" stroke="#334155" stroke-width="1" stroke-dasharray="12 4" />
  <circle cx="300" cy="250" r="90" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Dynamic Orbital Paths -->
  <ellipse cx="300" cy="250" rx="220" ry="85" transform="rotate(-25 300 250)" stroke="url(#hero-grad-line)" stroke-width="2" stroke-dasharray="180 80" />
  <ellipse cx="300" cy="250" rx="200" ry="75" transform="rotate(35 300 250)" stroke="url(#hero-grad-line)" stroke-width="1.8" stroke-dasharray="140 60" />

  <!-- Core Polygons & Interconnect Grid -->
  <g filter="url(#blur-glow)">
    <!-- Central Prism -->
    <polygon points="300,160 380,210 380,300 300,350 220,300 220,210" stroke="#22D3EE" stroke-width="2" fill="none" />
    <polygon points="300,185 360,225 360,290 300,330 240,290 240,225" stroke="#2563EB" stroke-width="1.5" fill="#0B1528" fill-opacity="0.6" />

    <!-- Connecting Spoke Lines -->
    <line x1="300" y1="160" x2="300" y2="185" stroke="#22D3EE" stroke-width="2" />
    <line x1="380" y1="210" x2="360" y2="225" stroke="#22D3EE" stroke-width="2" />
    <line x1="380" y1="300" x2="360" y2="290" stroke="#22D3EE" stroke-width="2" />
    <line x1="300" y1="350" x2="300" y2="330" stroke="#22D3EE" stroke-width="2" />
    <line x1="220" y1="300" x2="240" y2="290" stroke="#22D3EE" stroke-width="2" />
    <line x1="220" y1="210" x2="240" y2="225" stroke="#22D3EE" stroke-width="2" />

    <!-- Radiant Rays to Outer Nodes -->
    <line x1="300" y1="160" x2="440" y2="110" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="380" y1="210" x2="490" y2="240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="380" y1="300" x2="450" y2="390" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="300" y1="350" x2="210" y2="420" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="220" y1="300" x2="130" y2="320" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 5" />
    <line x1="220" y1="210" x2="160" y2="120" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 5" />
  </g>

  <!-- Network Nodes & Badges -->
  <!-- Top Node (AI / Intelligence) -->
  <circle cx="440" cy="110" r="18" fill="#0B1528" stroke="#22D3EE" stroke-width="2" />
  <circle cx="440" cy="110" r="6" fill="#22D3EE" />

  <!-- Right Node (Cloud / Deployment) -->
  <circle cx="490" cy="240" r="16" fill="#0B1528" stroke="#2563EB" stroke-width="2" />
  <circle cx="490" cy="240" r="5" fill="#38BDF8" />

  <!-- Bottom-Right Node (Automation) -->
  <circle cx="450" cy="390" r="14" fill="#0B1528" stroke="#14B8A6" stroke-width="2" />
  <circle cx="450" cy="390" r="4" fill="#14B8A6" />

  <!-- Bottom-Left Node (APIs) -->
  <circle cx="210" cy="420" r="15" fill="#0B1528" stroke="#2563EB" stroke-width="2" />
  <circle cx="210" cy="420" r="5" fill="#2563EB" />

  <!-- Left Node (Data & Sync) -->
  <circle cx="130" cy="320" r="16" fill="#0B1528" stroke="#22D3EE" stroke-width="2" />
  <circle cx="130" cy="320" r="5" fill="#22D3EE" />

  <!-- Top-Left Node (Prototypes) -->
  <circle cx="160" cy="120" r="14" fill="#0B1528" stroke="#14B8A6" stroke-width="2" />
  <circle cx="160" cy="120" r="4" fill="#14B8A6" />

  <!-- Central Energy Core -->
  <circle cx="300" cy="255" r="8" fill="#FFFFFF" filter="url(#blur-glow)" />
  <circle cx="300" cy="255" r="4" fill="#22D3EE" />
</svg>
