<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none" aria-label="VertexOrbis Logo">
  <defs>
    <linearGradient id="vo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="vo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Outer Orbit -->
  <circle cx="20" cy="20" r="17" stroke="url(#vo-grad)" stroke-width="2.5" stroke-dasharray="80 25" stroke-linecap="round" />
  <!-- Inner Orbit (Tilted) -->
  <ellipse cx="20" cy="20" rx="14" ry="7" transform="rotate(-30 20 20)" stroke="url(#vo-glow)" stroke-width="1.5" stroke-dasharray="50 15" stroke-linecap="round" />
  <!-- Vertex Triangle / Nodes -->
  <polygon points="20,9 29,27 11,27" stroke="url(#vo-grad)" stroke-width="2" fill="none" stroke-linejoin="round" />
  <!-- Core Point -->
  <circle cx="20" cy="9" r="2.5" fill="#22D3EE" />
  <circle cx="29" cy="27" r="2.5" fill="#2563EB" />
  <circle cx="11" cy="27" r="2.5" fill="#14B8A6" />
  <circle cx="20" cy="19" r="3" fill="#FFFFFF" />
</svg>
