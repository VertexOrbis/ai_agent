<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />
  
  <!-- Neural / Cognitive Node Net -->
  <!-- Center Core -->
  <circle cx="40" cy="40" r="7" fill="url(#ai-grad)" />
  <circle cx="40" cy="40" r="14" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6" />
  
  <!-- Outer Satellite Nodes -->
  <circle cx="40" cy="22" r="3.5" fill="#22D3EE" />
  <circle cx="56" cy="32" r="3.5" fill="#38BDF8" />
  <circle cx="54" cy="52" r="3.5" fill="#2563EB" />
  <circle cx="26" cy="52" r="3.5" fill="#2563EB" />
  <circle cx="24" cy="32" r="3.5" fill="#22D3EE" />

  <!-- Synapse Connectors -->
  <line x1="40" y1="40" x2="40" y2="22" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.8" />
  <line x1="40" y1="40" x2="56" y2="32" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8" />
  <line x1="40" y1="40" x2="54" y2="52" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.8" />
  <line x1="40" y1="40" x2="26" y2="52" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.8" />
  <line x1="40" y1="40" x2="24" y2="32" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Ring Mesh -->
  <path d="M40 22 L56 32 L54 52 L26 52 L24 32 Z" stroke="url(#ai-grad)" stroke-width="1.2" stroke-dasharray="3 3" fill="none" />
</svg>
